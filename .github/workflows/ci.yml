name: CI

on:
  push:
    branches:
      - main
      - master
      - "codex/**"
  pull_request:

jobs:
  server:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-dotnet@v4.1.0
        with:
          dotnet-version: 8.0.x
      - name: Restore
        run: dotnet restore WifiPrintServer/WifiPrintServer.sln
      - name: Vulnerability Check
        run: dotnet list WifiPrintServer/WifiPrintServer.sln package --vulnerable --include-transitive
      - name: Build
        run: dotnet build WifiPrintServer/WifiPrintServer.sln --configuration Release --no-restore
      - name: Test
        run: dotnet test WifiPrintServer/WifiPrintServer.sln --configuration Release --no-build

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-java@v4.5.0
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v4.0.4
      - name: Install Android SDK packages
        run: |
          sdkmanager --install "platform-tools" "platforms;android-34" "build-tools;34.0.0"
      - name: Create local.properties
        run: |
          echo "sdk.dir=${ANDROID_SDK_ROOT}" > WifiPrintApp/local.properties
      - name: Assemble Debug
        working-directory: WifiPrintApp
        run: ./gradlew :app:assembleDebug
      - name: Unit Tests
        working-directory: WifiPrintApp
        run: ./gradlew :app:testDebugUnitTest
      - name: Lint
        working-directory: WifiPrintApp
        run: ./gradlew :app:lintDebug

  website:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-node@v4.1.0
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: website/package-lock.json
      - name: Install Dependencies
        run: npm ci
      - name: Production Audit
        run: npm audit --omit=dev
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2.3.7
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
